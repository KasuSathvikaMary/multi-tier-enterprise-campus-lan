! =======================================================
! HOSTNAME: CORE-02 (Campus Core Multilayer Switch 2)
! ROLE: High-Speed Routed Backbone
! =======================================================
enable
configure terminal

hostname CORE-02

! Enable Layer 3 IP Routing
ip routing

! Management & System Baseline
no ip domain-lookup
ip domain-name enterprise.lan

service password-encryption
enable secret 9 $9$XvF...c987...CampusAdminSecret!

username admin privilege 15 secret CampusAdmin2026!

! Loopback Interface for Router-ID and In-Band Management
interface Loopback0
 description OSPF Router-ID & System Management
 ip address 10.254.0.2 255.255.255.255
 no shutdown

! Core Interconnect EtherChannel to CORE-01 (Layer 3 Port-Channel)
interface GigabitEthernet1/0/23
 description Core-to-Core Interconnect Link 1
 no switchport
 channel-group 1 mode active
 no shutdown

interface GigabitEthernet1/0/24
 description Core-to-Core Interconnect Link 2
 no switchport
 channel-group 1 mode active
 no shutdown

interface Port-channel1
 description Routed Core-to-Core Backbone Trunk to CORE-01
 no switchport
 ip address 10.255.0.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown

! Routed Uplinks to Distribution Switches
interface GigabitEthernet1/0/1
 description Routed Uplink to DIST-01 Gi1/0/2
 no switchport
 ip address 10.255.0.9 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown

interface GigabitEthernet1/0/2
 description Routed Uplink to DIST-02 Gi1/0/2
 no switchport
 ip address 10.255.0.17 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown

! Dynamic Routing: OSPF Area 0 Backbone
router ospf 1
 router-id 10.254.0.2
 passive-interface default
 no passive-interface Port-channel1
 no passive-interface GigabitEthernet1/0/1
 no passive-interface GigabitEthernet1/0/2
 log-adjacency-changes detail
 auto-cost reference-bandwidth 10000

! SSH and Console Security
line con 0
 logging synchronous
 login local
 exec-timeout 15 0

line vty 0 4
 transport input ssh
 login local
 exec-timeout 15 0

end
write memory
