! =======================================================
! HOSTNAME: ACC-02 (Campus Access Switch 2 - Wiring Closet B)
! ROLE: Layer 2 Edge Access, Port Security & Trunking
! =======================================================
enable
configure terminal

hostname ACC-02

! Baseline Security
no ip domain-lookup
ip domain-name enterprise.lan

service password-encryption
enable secret 9 $9$XvF...c987...CampusAdminSecret!
username admin privilege 15 secret CampusAdmin2026!

! Spanning Tree (Rapid PVST+)
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default

! VLAN Database Configuration
vlan 10
 name MGMT
vlan 20
 name HR
vlan 30
 name IT_ENG
vlan 40
 name FINANCE
vlan 50
 name EXECUTIVES
vlan 60
 name GUEST
vlan 99
 name NATIVE_PARK

! In-Band Management SVI
interface Vlan10
 description Management SVI
 ip address 10.10.10.12 255.255.255.0
 no shutdown

ip default-gateway 10.10.10.1

! Uplink EtherChannel to DIST-01 (Po21)
interface GigabitEthernet0/1
 description Uplink 1 to DIST-01 Gi1/0/13
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-group 21 mode active
 no shutdown

interface GigabitEthernet0/2
 description Uplink 2 to DIST-01 Gi1/0/14
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-group 21 mode active
 no shutdown

interface Port-channel21
 description LACP Trunk Uplink to DIST-01
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 no shutdown

! Uplink EtherChannel to DIST-02 (Po22)
interface GigabitEthernet0/3
 description Uplink 1 to DIST-02 Gi1/0/13
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-group 22 mode active
 no shutdown

interface GigabitEthernet0/4
 description Uplink 2 to DIST-02 Gi1/0/14
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-group 22 mode active
 no shutdown

interface Port-channel22
 description LACP Trunk Uplink to DIST-02
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 no shutdown

! Access Ports: HR Department (VLAN 20)
interface range FastEthernet0/1 - 5
 description HR Workstations
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

! Access Ports: IT Engineering Department (VLAN 30)
interface range FastEthernet0/6 - 10
 description IT Engineering Workstations
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

! Access Ports: Finance Department (VLAN 40)
interface range FastEthernet0/11 - 15
 description Finance Workstations
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

! Access Ports: Executive Department (VLAN 50)
interface range FastEthernet0/16 - 20
 description Executive Workstations
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

! Access Ports: Guest Wi-Fi / Visitors (VLAN 60)
interface range FastEthernet0/21 - 24
 description Guest Access Ports
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

line con 0
 logging synchronous
 login local
 exec-timeout 15 0

line vty 0 4
 transport input ssh
 login local
 exec-timeout 15 0

end
write memory
