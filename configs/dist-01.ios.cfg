! =======================================================
! HOSTNAME: DIST-01 (Campus Distribution Multilayer Switch 1)
! ROLE: Inter-VLAN SVI Routing & HSRP Primary (VLAN 10,20,30)
! =======================================================
enable
configure terminal

hostname DIST-01

! Enable Layer 3 Routing
ip routing

! Baseline Security
no ip domain-lookup
ip domain-name enterprise.lan

service password-encryption
enable secret 9 $9$XvF...c987...CampusAdminSecret!
username admin privilege 15 secret CampusAdmin2026!

! Spanning Tree Configuration (Rapid PVST+)
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
! DIST-01 is Root Primary for VLANs 10, 20, 30 and Secondary for 40, 50, 60
spanning-tree vlan 10,20,30 priority 4096
spanning-tree vlan 40,50,60 priority 8192

! VLAN Definitions
vlan 10
 name MGMT
vlan 20
 name HR
vlan 30
 name IT_ENG
vlan 40
 name FINANCE
vlan 50
 name EXECUTIVES
vlan 60
 name GUEST
vlan 99
 name NATIVE_PARK

! Loopback Interface
interface Loopback0
 description OSPF Router-ID & Management
 ip address 10.254.0.11 255.255.255.255
 no shutdown

! Uplink Tracking for HSRP
track 1 interface GigabitEthernet1/0/1 line-protocol
track 2 interface GigabitEthernet1/0/2 line-protocol

! Routed Uplinks to Core Switches
interface GigabitEthernet1/0/1
 description Routed Uplink to CORE-01 Gi1/0/1
 no switchport
 ip address 10.255.0.6 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown

interface GigabitEthernet1/0/2
 description Routed Uplink to CORE-02 Gi1/0/1
 no switchport
 ip address 10.255.0.10 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown

! Inter-Distribution L2 Trunk (Po2 to DIST-02)
interface GigabitEthernet1/0/23
 description Inter-Distribution Trunk 1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-group 2 mode active
 no shutdown

interface GigabitEthernet1/0/24
 description Inter-Distribution Trunk 2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-group 2 mode active
 no shutdown

interface Port-channel2
 description Inter-Distribution LACP Trunk to DIST-02
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 no shutdown

! Downlink EtherChannels to Access Switches
interface GigabitEthernet1/0/11
 description Downlink 1 to ACC-01
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-group 11 mode active
 no shutdown

interface GigabitEthernet1/0/12
 description Downlink 2 to ACC-01
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-group 11 mode active
 no shutdown

interface Port-channel11
 description LACP Trunk to ACC-01
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 no shutdown

interface GigabitEthernet1/0/13
 description Downlink 1 to ACC-02
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-group 21 mode active
 no shutdown

interface GigabitEthernet1/0/14
 description Downlink 2 to ACC-02
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 channel-group 21 mode active
 no shutdown

interface Port-channel21
 description LACP Trunk to ACC-02
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 no shutdown

! Guest Isolation Access List
ip access-list extended ACL-GUEST-RESTRICTION
 remark Permit DHCP to Gateway
 permit udp any any eq bootps
 permit udp any eq bootps any
 remark Permit DNS Lookups
 permit udp any host 8.8.8.8 eq domain
 permit udp any host 1.1.1.1 eq domain
 remark Isolate from Enterprise subnets (10.0.0.0/8 and 192.168.0.0/16)
 deny ip 172.16.60.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny ip 172.16.60.0 0.0.0.255 192.168.0.0 0.0.255.255
 remark Permit External Internet Egress
 permit ip 172.16.60.0 0.0.0.255 any

! Switch Virtual Interfaces (SVIs) with HSRPv2
interface Vlan10
 description Management Gateway SVI
 ip address 10.10.10.2 255.255.255.0
 standby version 2
 standby 10 ip 10.10.10.1
 standby 10 priority 110
 standby 10 preempt delay minimum 30
 standby 10 track 1 decrement 20
 no shutdown

interface Vlan20
 description HR Gateway SVI
 ip address 10.10.20.2 255.255.255.0
 standby version 2
 standby 20 ip 10.10.20.1
 standby 20 priority 110
 standby 20 preempt delay minimum 30
 standby 20 track 1 decrement 20
 no shutdown

interface Vlan30
 description IT Engineering Gateway SVI
 ip address 10.10.30.2 255.255.255.0
 standby version 2
 standby 30 ip 10.10.30.1
 standby 30 priority 110
 standby 30 preempt delay minimum 30
 standby 30 track 1 decrement 20
 no shutdown

interface Vlan40
 description Finance Gateway SVI
 ip address 10.10.40.2 255.255.255.0
 standby version 2
 standby 40 ip 10.10.40.1
 standby 40 priority 100
 standby 40 preempt delay minimum 30
 no shutdown

interface Vlan50
 description Executives Gateway SVI
 ip address 10.10.50.2 255.255.255.0
 standby version 2
 standby 50 ip 10.10.50.1
 standby 50 priority 100
 standby 50 preempt delay minimum 30
 no shutdown

interface Vlan60
 description Guest Gateway SVI
 ip address 172.16.60.2 255.255.255.0
 ip access-group ACL-GUEST-RESTRICTION in
 standby version 2
 standby 60 ip 172.16.60.1
 standby 60 priority 100
 standby 60 preempt delay minimum 30
 no shutdown

! Dynamic Routing: OSPF Area 0
router ospf 1
 router-id 10.254.0.11
 passive-interface default
 no passive-interface GigabitEthernet1/0/1
 no passive-interface GigabitEthernet1/0/2
 network 10.255.0.4 0.0.0.3 area 0
 network 10.255.0.8 0.0.0.3 area 0
 network 10.254.0.11 0.0.0.0 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.30.0 0.0.0.255 area 0
 network 10.10.40.0 0.0.0.255 area 0
 network 10.10.50.0 0.0.0.255 area 0
 network 172.16.60.0 0.0.0.255 area 0
 log-adjacency-changes detail
 auto-cost reference-bandwidth 10000

line con 0
 logging synchronous
 login local
 exec-timeout 15 0

line vty 0 4
 transport input ssh
 login local
 exec-timeout 15 0

end
write memory
