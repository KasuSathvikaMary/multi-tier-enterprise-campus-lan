! =======================================================
! HOSTNAME: EDGE-ROUTER (Campus Border / WAN Gateway)
! ROLE: Perimeter Routing & External Gateway
! =======================================================
enable
configure terminal

hostname EDGE-ROUTER

no ip domain-lookup
ip domain-name enterprise.lan

service password-encryption
enable secret 9 $9$XvF...c987...CampusAdminSecret!
username admin privilege 15 secret CampusAdmin2026!

! Loopback Interface simulating Internet / Upstream WAN
interface Loopback0
 description Simulated External WAN / Internet Target
 ip address 10.254.0.254 255.255.255.255
 no shutdown

! Routed Transit to Campus Core (CORE-01)
interface GigabitEthernet0/0/0
 description Transit Link to CORE-01 Gi1/0/10
 ip address 10.255.255.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
 no shutdown

! Dynamic Routing: OSPF Area 0
router ospf 1
 router-id 10.254.0.254
 network 10.255.255.0 0.0.0.3 area 0
 network 10.254.0.254 0.0.0.0 area 0
 default-information originate
 log-adjacency-changes detail

line con 0
 logging synchronous
 login local
 exec-timeout 15 0

line vty 0 4
 transport input ssh
 login local
 exec-timeout 15 0

end
write memory
